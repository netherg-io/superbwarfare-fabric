name: Prepare isolated drone adapter patch
on:
  push:
    branches: [feat/drone-control-ownership]
    paths: [.github/workflows/review-drone-apply.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify baseline and wire policy into existing handlers
        run: |
          test "$(git rev-parse HEAD^)" = 8c6a00547a6812703ca632915b149e31e185a014
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          root = 'src/main/kotlin/com/atsuishio/superbwarfare/network/message/send/'
          paths = {
            root+'DroneFireMessage.kt':'17bc47235210696fb64254e1111f5e15ddda652b',
            root+'MouseMoveMessage.kt':'a7dbf1fd79262e649e80d928cad9388b2d07c44e',
            root+'VehicleMovementMessage.kt':'6d5d0facd86b78708478a24495d74d122330ea44',
            'src/main/java/com/atsuishio/superbwarfare/entity/vehicle/DroneEntity.kt':'d1655c1fd5b94badee8260ce8a980238884d53dc',
          }
          for p, expected in paths.items():
              assert subprocess.check_output(['git','hash-object',p], text=True).strip() == expected, p
          def replace(p, old, new):
              path = Path(p)
              s = path.read_text()
              assert s.count(old) == 1, (p, old)
              path.write_text(s.replace(old,new))
          for name in ('DroneFireMessage','MouseMoveMessage','VehicleMovementMessage'):
              replace(root+name+'.kt', 'import com.atsuishio.superbwarfare.init.ModItems', 'import com.atsuishio.superbwarfare.entity.vehicle.canAcceptControl\nimport com.atsuishio.superbwarfare.init.ModItems')
          replace(root+'DroneFireMessage.kt', 'val drone = EntityFindUtil.findDrone(player.level(), mainTag.getString("LinkedDrone")) ?: return', 'val drone = EntityFindUtil.findDrone(player.level(), mainTag.getString("LinkedDrone")) ?: return\n            if (!drone.canAcceptControl(player)) return')
          replace(root+'MouseMoveMessage.kt', 'import com.atsuishio.superbwarfare.network.PayloadContext', 'import com.atsuishio.superbwarfare.network.security.DroneControlPolicy\nimport com.atsuishio.superbwarfare.network.PayloadContext')
          replace(root+'MouseMoveMessage.kt', '        val player = sender()', '        if (!DroneControlPolicy.validMouse(speedX, speedY)) return\n        val player = sender()')
          replace(root+'MouseMoveMessage.kt', 'if (drone != null)', 'if (drone != null && drone.canAcceptControl(player))')
          replace(root+'VehicleMovementMessage.kt', 'EntityFindUtil.findDrone(player.level(), tag.getString("LinkedDrone")) ?: return', 'EntityFindUtil.findDrone(player.level(), tag.getString("LinkedDrone"))\n                ?.takeIf { it.canAcceptControl(player) } ?: return')
          replace('src/main/java/com/atsuishio/superbwarfare/entity/vehicle/DroneEntity.kt', '    override fun baseTick() {\n        pitchO = this.bodyPitch', '    override fun baseTick() {\n        if (!this.level().isClientSide() && !canAcceptControl(getController())) clearOperatorInput()\n        pitchO = this.bodyPitch')
          PY
          python3 tools/drone-tests/check_wiring.py
          git diff --check
      - name: Commit only to the isolated review branch
        run: |
          rm .github/workflows/review-drone-apply.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main .github/workflows/review-drone-apply.yml
          git commit -m 'fix(drone): enforce current controller and clear invalid input before ticking'
          git push origin HEAD:feat/drone-control-ownership
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew -p tools/drone-tests --no-daemon run
