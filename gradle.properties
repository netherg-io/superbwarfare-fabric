org.gradle.jvmargs=-Xmx2G -XX:+UseParallelGC -XX:MaxMetaspaceSize=512m
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
kotlin.daemon.jvmargs=-Xmx2G -XX:+UseParallelGC

# Retain VFS state across builds (default=1). Higher values mean more
# file fingerprints survive daemon restarts, reducing re-scanning.
org.gradle.vfs.retain=3

minecraft_version_range=[1.21.1,1.22)
minecraft_version=1.21.1
neo_version=21.1.228
neo_version_range=[21.1.203,)
loader_version_range=[5.8.0,)
# The Minecraft version the Parchment version is for
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

mod_id=superbwarfare
mod_name=Superb Warfare
mod_license=LGPL-3.0-only
mod_description=A Warfare Mod
mod_version=0.8.9.1
mod_authors=Atsuishio, Roki27, Light_Quanta and other contributors
# dependencies
ponder_version=1.0.87
jei_version=19.25.0.322
cloth_config_version=15.0.140
jade_version=4681833
real_camera_id=6943480
# Fabric
loader_version=0.19.3
fabric_version=0.116.15+1.21.1
# ровно та версия Kotlin, что у апстрима
flk_version=1.13.7+kotlin.2.2.21

# The port builds within a single 2 GiB JVM on the development machine.
kotlin.compiler.execution.strategy=in-process
org.gradle.workers.max=2
